[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spider-xhs"
version = "0.0.0"
description = "Xiaohongshu (RED) data spider: search notes, details, comments, export."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "cv-cat" }]
dependencies = [
  "PyExecJS",
  "requests",
  "loguru",
  "python-dotenv",
  "retry",
  "openpyxl",
]

[project.optional-dependencies]
dev = [
  "nodeenv>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apis",
  "xhs_utils",
]

[tool.hatch.build.targets.sdist]
include = [
  "apis",
  "xhs_utils",
  "static",
  "main.py",
  "README.md",
  "Dockerfile",
]
